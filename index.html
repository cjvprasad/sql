<?php

$folder = "files/";

$pdfFiles = [];

// Read all files from the files folder
if (is_dir($folder)) {

    $files = scandir($folder);

    foreach ($files as $file) {

        $extension = strtolower(pathinfo($file, PATHINFO_EXTENSION));

        if ($extension === "pdf") {

            $pdfFiles[] = [
                "name" => pathinfo($file, PATHINFO_FILENAME),
                "file" => $folder . $file
            ];

        }
    }
}

?>

<body>


<!-- HEADER -->

<div class="header">

    <h2>📚 PDF Library</h2>

    <input
        class="upload"
        type="file"
        id="uploadPDF"
        accept="application/pdf"
    >

</div>



<!-- MAIN -->

<div class="main">


    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>PDF Files</h2>

        <div id="pdfList">


            <?php if (empty($pdfFiles)): ?>

                <p>No PDF files found.</p>


            <?php else: ?>

                <?php foreach ($pdfFiles as $index => $pdf): ?>

                    <div
                        class="pdf-item <?= $index === 0 ? 'active' : '' ?>"
                        onclick="openPDF(
                            '<?= htmlspecialchars($pdf['file'], ENT_QUOTES) ?>',
                            '<?= htmlspecialchars($pdf['name'], ENT_QUOTES) ?>',
                            this
                        )"
                    >

                        <span class="pdf-icon">📄</span>

                        <?= htmlspecialchars($pdf['name']) ?>

                    </div>

                <?php endforeach; ?>

            <?php endif; ?>


        </div>

    </div>



    <!-- PDF VIEWER -->

    <div class="viewer">


        <div
            class="viewer-header"
            id="viewerTitle"
        >

            <?php

            if (!empty($pdfFiles)) {

                echo htmlspecialchars($pdfFiles[0]['name']);

            } else {

                echo "Select a PDF";

            }

            ?>

        </div>


        <div
            id="viewerContainer"
            class="<?= empty($pdfFiles) ? 'empty' : '' ?>"
        >

            <?php if (!empty($pdfFiles)): ?>

                <iframe
                    src="<?= htmlspecialchars($pdfFiles[0]['file']) ?>"
                ></iframe>

            <?php else: ?>

                <div>

                    <h2>📄 PDF Viewer</h2>

                    <p>Select a PDF from the left side.</p>

                </div>

            <?php endif; ?>

        </div>


    </div>


</div>



<script>


function openPDF(file, name, element) {


    // Remove active class
    document
        .querySelectorAll(".pdf-item")
        .forEach(item => {

            item.classList.remove("active");

        });


    // Add active class
    element.classList.add("active");


    // Change title
    document.getElementById("viewerTitle")
        .textContent = name;


    // Display PDF
    const container =
        document.getElementById("viewerContainer");


    container.classList.remove("empty");


    container.innerHTML = `

        <iframe
            src="${file}"
            title="${name}">
        </iframe>

    `;

}



</script>


</body>
