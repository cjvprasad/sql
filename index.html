<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PDF Library</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }


        /* HEADER */

        .header {

            height: 65px;

            background: #1f2937;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

        }


        .header h2 {
            margin: 0;
        }


        .upload {

            background: white;

            color: #111827;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

        }


        /* MAIN */

        .main {

            display: flex;

            height: calc(100vh - 65px);

        }


        /* SIDEBAR */

        .sidebar {

            width: 350px;

            background: white;

            border-right: 1px solid #ddd;

            overflow-y: auto;

            padding: 20px;

        }


        .sidebar h2 {

            margin-top: 0;

        }


        .pdf-item {

            padding: 15px;

            margin-bottom: 10px;

            background: #f1f2f4;

            border-radius: 8px;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;

        }


        .pdf-item:hover {

            background: #e5e7eb;

        }


        .pdf-item.active {

            background: #dbeafe;

            border-left: 5px solid #2563eb;

        }


        .pdf-icon {

            margin-right: 10px;

        }


        .status-note {

            font-size: 13px;

            color: #777;

            margin-top: 4px;

        }


        .status-note.error {

            color: #b91c1c;

        }


        /* VIEWER */

        .viewer {

            flex: 1;

            min-width: 0;

            height: 100%;

            padding: 20px;

            display: flex;

            flex-direction: column;

        }


        .viewer-header {

            background: white;

            padding: 15px 20px;

            border-radius: 8px 8px 0 0;

            font-size: 20px;

            font-weight: bold;

            flex-shrink: 0;

        }


        /* IMPORTANT */

        #viewerContainer {

            flex: 1;

            min-height: 0;

            background: white;

        }


        iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        .empty {

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777;

            text-align: center;

            padding: 20px;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .main {

                flex-direction: column;

            }


            .sidebar {

                width: 100%;

                height: 220px;

                border-right: none;

                border-bottom: 1px solid #ddd;

            }


            .viewer {

                height: calc(100vh - 285px);

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h2>📚 PDF Library</h2>

    <input
        class="upload"
        type="file"
        id="uploadPDF"
        accept="application/pdf"
    >

</div>



<!-- MAIN -->

<div class="main">


    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>PDF Files</h2>

        <div id="pdfList">
            <p>Loading files…</p>
        </div>

    </div>



    <!-- PDF VIEWER -->

    <div class="viewer">


        <div
            class="viewer-header"
            id="viewerTitle"
        >
            Select a PDF
        </div>


        <div
            id="viewerContainer"
            class="empty"
        >

            <div>

                <h2>📄 PDF Viewer</h2>

                <p>Select a PDF from the left side.</p>

            </div>

        </div>


    </div>


</div>



<script>

    // ---- CONFIGURE THIS ----
    // Your site is at https://cjvprasad.github.io/pdf/
    // which means: owner = cjvprasad, repo = pdf
    const CONFIG = {
        owner: "cjvprasad",
        repo: "pdf",
        folder: "files",       // the folder in your repo that holds the PDFs
        branches: ["main", "master"]  // tried in order, whichever your repo uses
    };
    // -------------------------


    const pdfListEl = document.getElementById("pdfList");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerContainer = document.getElementById("viewerContainer");
    const uploadInput = document.getElementById("uploadPDF");


    function openPDF(fileUrl, name, element) {

        // Remove active class from all items
        document
            .querySelectorAll(".pdf-item")
            .forEach(item => {
                item.classList.remove("active");
            });

        if (element) {
            element.classList.add("active");
        }

        viewerTitle.textContent = name;

        viewerContainer.classList.remove("empty");

        viewerContainer.innerHTML = `
            <iframe
                src="${fileUrl}"
                title="${name}">
            </iframe>
        `;
    }


    function renderPdfList(pdfFiles) {

        if (!pdfFiles.length) {
            pdfListEl.innerHTML = `<p>No PDF files found in "${CONFIG.folder}/".</p>`;
            return;
        }

        pdfListEl.innerHTML = "";

        pdfFiles.forEach((pdf, index) => {

            const item = document.createElement("div");
            item.className = "pdf-item" + (index === 0 ? " active" : "");
            item.innerHTML = `<span class="pdf-icon">📄</span>${pdf.name}`;

            item.addEventListener("click", () => {
                openPDF(pdf.url, pdf.name, item);
            });

            pdfListEl.appendChild(item);
        });

        // Auto-open the first PDF
        const firstItem = pdfListEl.querySelector(".pdf-item");
        openPDF(pdfFiles[0].url, pdfFiles[0].name, firstItem);
    }


    async function tryFetchBranch(branch) {

        // GitHub API: list contents of the folder on this branch
        const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${branch}`;

        const res = await fetch(apiUrl);

        if (!res.ok) {
            throw new Error(`Branch "${branch}" folder lookup failed (${res.status})`);
        }

        const items = await res.json();

        if (!Array.isArray(items)) {
            throw new Error("Unexpected API response");
        }

        return items
            .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".pdf"))
            .map(item => ({
                name: item.name.replace(/\.pdf$/i, ""),
                // Relative path works whether you're on a custom domain or
                // the /pdf/ project-pages subpath.
                url: CONFIG.folder + "/" + item.name
            }));
    }


    async function loadPdfList() {

        let lastError = null;

        for (const branch of CONFIG.branches) {
            try {
                const pdfFiles = await tryFetchBranch(branch);
                renderPdfList(pdfFiles);
                return;
            } catch (err) {
                lastError = err;
            }
        }

        // All branches failed — fall back to just trying the relative path directly.
        pdfListEl.innerHTML = `
            <p>Couldn't list files automatically.</p>
            <p class="status-note error">${lastError ? lastError.message : "Unknown error"}</p>
            <p class="status-note">Check that the repo is public and that "${CONFIG.folder}/" exists in it.</p>
        `;
    }


    // Manual upload still works as a fallback / override
    uploadInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        if (file.type !== "application/pdf") {
            alert("Please select a PDF file.");
            return;
        }

        const pdfUrl = URL.createObjectURL(file);
        openPDF(pdfUrl, file.name.replace(/\.pdf$/i, ""), null);
    });


    loadPdfList();

</script>


</body>

</html>
